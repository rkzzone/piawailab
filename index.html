<style>
@font-face{font-family:'PJS';font-weight:400;font-display:swap;src:url(vendor/fonts/pjs-400.woff2) format('woff2')}
@font-face{font-family:'PJS';font-weight:500;font-display:swap;src:url(vendor/fonts/pjs-500.woff2) format('woff2')}
@font-face{font-family:'PJS';font-weight:600;font-display:swap;src:url(vendor/fonts/pjs-600.woff2) format('woff2')}
@font-face{font-family:'PJS';font-weight:700;font-display:swap;src:url(vendor/fonts/pjs-700.woff2) format('woff2')}
@font-face{font-family:'PJS';font-weight:800;font-display:swap;src:url(vendor/fonts/pjs-800.woff2) format('woff2')}
:root{
  --font:'Plus Jakarta Sans','PJS',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#fafafc;--surface:#fff;--surface-2:#f4f4f8;--surface-3:#ececf3;--line:#e7e7ef;--line-2:#d8d8e4;
  --ink:#15151c;--ink-2:#45455a;--muted:#77778c;--faint:#a3a3b5;
  --brand:#6a4cff;--brand-2:#5536f0;--brand-soft:#efebff;
  --ok:#14a058;--ok-soft:#e6f7ee;--warn:#c27009;--warn-soft:#fff5e6;--danger:#e0393e;--danger-soft:#fdecec;
  --r-sm:8px;--r:12px;--r-lg:18px;--r-xl:24px;
  --sh-sm:0 1px 2px rgba(22,20,60,.06);
  --sh:0 1px 2px rgba(22,20,60,.04),0 8px 24px -10px rgba(22,20,60,.14);
  --sh-lg:0 2px 6px rgba(22,20,60,.05),0 28px 64px -24px rgba(22,20,60,.28);
  --ring:0 0 0 3px color-mix(in srgb,var(--brand) 28%,transparent);
  --checker:#eeeef3;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0d0d12;--surface:#15151c;--surface-2:#1b1b24;--surface-3:#23232e;--line:#262632;--line-2:#33333f;
  --ink:#ededf4;--ink-2:#c0c0d0;--muted:#8d8da0;--faint:#5f5f72;
  --brand:#8f78ff;--brand-2:#a593ff;--brand-soft:#231e40;
  --ok:#3ccf7e;--ok-soft:#10291c;--warn:#f0a43a;--warn-soft:#2c210f;--danger:#ff6b6f;--danger-soft:#33171a;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.6);--sh-lg:0 30px 70px -20px rgba(0,0,0,.75);
  --checker:#22222c;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
::selection{background:color-mix(in srgb,var(--brand) 25%,transparent)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;gap:18px;padding:0 max(20px,calc((100vw - 1240px)/2));background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.6px}
.logo-mark{width:32px;height:32px;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px;background:var(--ink)}
.logo-mark i{border-radius:3px}.logo-mark i:nth-child(1){background:#ff6b5b}.logo-mark i:nth-child(2){background:#ffb648}.logo-mark i:nth-child(3){background:#7c5cff}.logo-mark i:nth-child(4){background:#2ec4a6}
[data-theme=dark] .logo-mark{background:#2a2a36}
.logo b{color:var(--brand)}
.tools-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:10px;font-weight:600;color:var(--ink-2);background:var(--surface);transition:.15s}
.tools-btn:hover,.tools-btn[aria-expanded=true]{border-color:var(--line-2);color:var(--ink)}
.tools-btn .chev{width:16px;height:16px;transition:transform .2s}.tools-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.quick{display:flex;gap:2px}
.quick a{padding:8px 11px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:13.5px;transition:.15s}
.quick a:hover{background:var(--surface-2);color:var(--ink)}
.quick a.on{color:var(--brand)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill-safe{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:700}
.pill-safe .ic{width:15px;height:15px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);transition:.15s}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn .ic{width:18px;height:18px}

.mega{position:fixed;top:64px;left:0;right:0;z-index:39;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh-lg);padding:26px max(20px,calc((100vw - 1240px)/2)) 30px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.18s}
.mega.open{opacity:1;transform:none;pointer-events:auto}
.mega h4{margin:0 0 10px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.mega a{display:flex;align-items:center;gap:10px;padding:7px 8px;margin:0 -8px;border-radius:9px;font-weight:600;font-size:13.5px}
.mega a:hover{background:var(--surface-2)}
.scrim{position:fixed;inset:64px 0 0;z-index:38;background:rgba(10,10,25,.18);opacity:0;pointer-events:none;transition:.18s}
.scrim.open{opacity:1;pointer-events:auto}

/* tool icon tile */
.ti{--s:36px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.28);display:grid;place-items:center;color:#fff;background:var(--tc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.ti .ic{width:calc(var(--s)*.54);height:calc(var(--s)*.54);stroke-width:2}
.ti.sm{--s:28px}.ti.lg{--s:56px}.ti.xl{--s:64px}

/* ---------- layout ---------- */
main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:0 20px 80px}
.foot{border-top:1px solid var(--line);padding:22px max(20px,calc((100vw - 1240px)/2));display:flex;gap:18px;justify-content:space-between;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.foot b{color:var(--ink-2)}
.foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}

/* ---------- home ---------- */
.hero{text-align:center;padding:64px 0 34px;max-width:780px;margin:0 auto}
.kicker{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);box-shadow:var(--sh-sm)}
.kicker span{background:var(--brand);color:#fff;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:700}
.hero h1{font-size:clamp(36px,5.4vw,58px);line-height:1.06;letter-spacing:-1.8px;font-weight:800;margin:20px 0 16px}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,#6a4cff 10%,#c04cff 55%,#ff6b5b 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:17px;margin:0 auto;max-width:560px}
.search{position:relative;max-width:560px;margin:30px auto 0}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 56px 0 48px;font-size:15px;box-shadow:var(--sh);transition:.15s}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:var(--sh),var(--ring)}
.kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:28px 0 26px}
.chip{height:36px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-2);transition:.15s}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.grid-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tcard{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);transition:transform .18s,box-shadow .18s,border-color .18s;min-height:156px}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--tc) 40%,var(--line))}
.tcard strong{font-size:15px;font-weight:700;letter-spacing:-.2px}
.tcard p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.tcard .go{position:absolute;right:16px;top:20px;color:var(--faint);transition:.18s}
.tcard:hover .go{color:var(--tc);transform:translateX(3px)}
.tcard .badge{position:absolute;right:16px;bottom:16px;font-size:10.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.empty-search{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:56px}
.feat{padding:22px;border-radius:var(--r-lg);background:var(--surface-2);display:flex;gap:14px;align-items:flex-start}
.feat .fi{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--brand);box-shadow:var(--sh-sm)}
.feat strong{display:block;font-size:14.5px;margin-bottom:3px}
.feat p{margin:0;color:var(--muted);font-size:13px}

/* ---------- tool page ---------- */
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;padding:18px 0 0}
.crumb a:hover{color:var(--ink)}.crumb .ic{width:14px;height:14px}
.thero{text-align:center;padding:26px 0 30px}
.thero .ti{margin:0 auto 16px}
.thero h1{margin:0;font-size:clamp(30px,4vw,42px);letter-spacing:-1.4px;font-weight:800;line-height:1.1}
.thero p{margin:10px auto 0;color:var(--muted);font-size:15.5px;max-width:620px}
.thero.compact{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 0 20px}
.thero.compact .ti{margin:0;--s:44px}
.thero.compact h1{font-size:24px;letter-spacing:-.6px}
.thero.compact p{margin:2px 0 0;font-size:13.5px;max-width:none}

.drop{position:relative;max-width:920px;margin:0 auto;border-radius:var(--r-xl);background:var(--tc);padding:14px;color:#fff;box-shadow:0 24px 50px -24px color-mix(in srgb,var(--tc) 80%,transparent);transition:transform .2s}
.drop-in{border:2px dashed rgba(255,255,255,.45);border-radius:calc(var(--r-xl) - 8px);min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;transition:.2s}
.drop.over .drop-in,.drop:hover .drop-in{border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.06)}
.drop-art{position:relative;width:96px;height:76px}
.drop-art div{position:absolute;width:52px;height:66px;border-radius:9px;background:rgba(255,255,255,.95);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.drop-art div:nth-child(1){left:8px;top:8px;transform:rotate(-10deg);opacity:.55}
.drop-art div:nth-child(2){left:38px;top:4px;transform:rotate(9deg);opacity:.75}
.drop-art div:nth-child(3){left:22px;top:0;display:grid;place-items:center;color:var(--tc)}
.drop-art .ic{width:24px;height:24px;stroke-width:2}
.choose{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:14px;background:#fff;color:#1b1b26;font-weight:800;font-size:15px;letter-spacing:.2px;box-shadow:0 8px 18px rgba(0,0,0,.14);transition:.15s}
.choose:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
.choose .ic{color:var(--tc);stroke-width:2.2}
.drop-in p{margin:0;font-size:14px;opacity:.92}
.drop-in small{font-size:11.5px;opacity:.75;letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.perks{list-style:none;display:flex;justify-content:center;flex-wrap:wrap;gap:12px 28px;padding:0;margin:26px auto 0;max-width:920px}
.perks li{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13.5px;font-weight:500}
.perks .ck{width:20px;height:20px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.perks .ck .ic{width:13px;height:13px;stroke-width:3}

/* workspace */
.ws{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.ws-main{min-width:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line)}
.bar .info{font-weight:700;padding:0 6px;margin-right:auto;font-size:13.5px}
.bar .info span{color:var(--muted);font-weight:500}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid transparent;transition:.12s}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.tbtn .ic{width:16px;height:16px}
.tbtn.outline{border-color:var(--line)}
.tbtn.danger:hover{color:var(--danger);background:var(--danger-soft)}
.tbtn:disabled{opacity:.4;pointer-events:none}
.ws-body{padding:16px;min-height:380px;background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.hint-line{font-size:12px;color:var(--muted);padding:10px 16px;display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line)}
.hint-line kbd{font:600 10.5px var(--font);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}

/* pages grid */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pg{position:relative;border-radius:12px;padding:8px;background:var(--surface);border:1.5px solid transparent;box-shadow:var(--sh-sm);cursor:grab;transition:border-color .12s,box-shadow .12s;user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-touch-callout:none}
.pg[hidden]{display:none}
.pg:hover{box-shadow:var(--sh)}
.pg.sel{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 20%,transparent)}
.pg-ph{border-radius:12px;border:2px dashed color-mix(in srgb,var(--tc) 55%,transparent);background:color-mix(in srgb,var(--tc) 7%,transparent)}
.ghost{position:fixed!important;left:0;top:0;margin:0;z-index:100;pointer-events:none;will-change:transform;border-color:var(--tc)!important;box-shadow:0 22px 50px -12px rgba(20,18,60,.35),0 0 0 3px color-mix(in srgb,var(--tc) 25%,transparent)!important;cursor:grabbing}
.ghost .pg-tools{display:none}
.ghost.stack{box-shadow:7px 7px 0 -2px var(--surface),7px 7px 0 -.5px var(--line-2),14px 14px 0 -4px var(--surface),14px 14px 0 -2.5px var(--line-2),0 26px 50px -12px rgba(20,18,60,.4)!important}
.ghost-count{position:absolute;top:-11px;right:-11px;min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--tc);color:#fff;font-weight:800;font-size:12.5px;display:grid;place-items:center;box-shadow:var(--sh)}
.pages.sorting .pg-tools{display:none}
body.dragging-pages,body.dragging-pages *{cursor:grabbing!important;user-select:none!important}
.pg-thumb{aspect-ratio:1;display:grid;place-items:center;border-radius:7px;background:var(--surface-2);overflow:hidden}
.pg-thumb img{max-width:100%;max-height:100%;display:block;box-shadow:0 1px 4px rgba(0,0,0,.12);background:#fff;transition:transform .2s}
.skel{width:70%;height:90%;border-radius:4px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.pg-meta{display:flex;align-items:center;gap:7px;padding:8px 2px 0}
.pg-num{flex:none;min-width:22px;height:20px;padding:0 6px;border-radius:6px;background:var(--surface-2);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--ink-2)}
.pg.sel .pg-num{background:var(--tc);color:#fff}
.pg-name{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-tools{position:absolute;top:13px;right:13px;display:flex;gap:4px;opacity:0;transform:translateY(-3px);transition:.15s}
.pg:hover .pg-tools,.pg:focus-within .pg-tools{opacity:1;transform:none}
.pg-tools button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--sh)}
.pg-tools button:hover{color:var(--ink)}
.pg-tools button.del:hover{color:var(--danger)}
.pg-tools .ic{width:15px;height:15px}
.pg-rot{position:absolute;left:13px;top:13px;font-size:10.5px;font-weight:700;background:var(--ink);color:var(--surface);padding:1px 6px;border-radius:6px}
.sources{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.src{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.src b{font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src span{color:var(--muted)}
.src button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.src button:hover{background:var(--danger-soft);color:var(--danger)}
.src .ic{width:13px;height:13px}
.src.loading{opacity:.7}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--tc,var(--brand));animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* files list */
.flist{display:grid;gap:10px}
.frow{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm)}
.fthumb{width:48px;height:60px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line)}
.fthumb img{max-width:100%;max-height:100%}
.fthumb .ic{color:var(--faint)}
.finfo{min-width:0;flex:1}
.finfo b{display:block;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.finfo span{color:var(--muted);font-size:12px}
.finfo .fnote{display:flex;align-items:center;gap:5px;margin-top:3px;color:var(--tc);font-weight:600;font-size:11.5px}.finfo .fnote .ic{width:13px;height:13px}
.fext{font-size:10px;font-weight:800;color:var(--tc);letter-spacing:.4px}
.frow .x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.frow .x:hover{background:var(--danger-soft);color:var(--danger)}
.add-tile{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;border:1.5px dashed var(--line-2);color:var(--ink-2);font-weight:600;font-size:13px;transition:.15s}
.add-tile:hover{border-color:var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 5%,transparent)}
.preview-wrap{margin-top:16px;text-align:center}
.preview-wrap canvas{max-width:100%;border-radius:6px;box-shadow:var(--sh);background:#fff}
.preview-cap{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}

/* sidebar */
.side{position:sticky;top:84px;padding:20px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 104px);overflow:auto}
.side h3{margin:0;font-size:16px;letter-spacing:-.2px}
.side .sub{margin:-12px 0 0;color:var(--muted);font-size:12.5px}
.opt{display:grid;gap:8px}
.opt>label,.opt .lbl{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.opt .lbl output{font-weight:600;color:var(--muted)}
.opt small{color:var(--muted);font-size:11.5px;line-height:1.45}
.inp{height:40px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;transition:.15s;min-width:0}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.inp-suffix{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.inp-suffix:focus-within{border-color:var(--brand);box-shadow:var(--ring)}
.inp-suffix .inp{border:0;box-shadow:none!important}
.inp-suffix span{padding:0 12px;color:var(--muted);font-size:12.5px;font-weight:600;background:var(--surface-2);align-self:stretch;display:grid;place-items:center}
.rcards{display:grid;gap:8px}
.rcard{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;transition:.12s;background:var(--surface)}
.rcard:hover{border-color:var(--line-2)}
.rcard.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 6%,var(--surface))}
.rcard .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none;margin-top:1px;display:grid;place-items:center}
.rcard.on .dot{border-color:var(--tc)}
.rcard.on .dot::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--tc)}
.rcard b{display:block;font-size:13px}
.rcard small{display:block;margin-top:2px}
.rcard .tag{float:right;font-size:10px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:1px 7px;border-radius:99px;margin-left:6px}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--surface-2);gap:3px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.12s;white-space:nowrap;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:132px;padding:6px;border-radius:10px;background:var(--surface-2)}
.posgrid button{height:26px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line)}
.posgrid button.on{background:var(--tc);border-color:var(--tc)}
.posgrid button:disabled{visibility:hidden}
.tog{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;cursor:pointer}
.tog b{font-size:12.5px;display:block}
.tog small{display:block;margin-top:2px}
.sw{position:relative;width:38px;height:22px;flex:none;margin-top:1px}
.sw input{position:absolute;opacity:0;inset:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:.18s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.18s}
.sw input:checked+i{background:var(--tc)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{box-shadow:var(--ring)}
input[type=range]{width:100%;accent-color:var(--tc)}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface)}
.swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.swatches button{width:28px;height:28px;border-radius:9px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.swatches button.on{box-shadow:0 0 0 2px var(--tc)}
.checker{background-color:#fff;background-image:linear-gradient(45deg,var(--checker) 25%,transparent 25%),linear-gradient(-45deg,var(--checker) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--checker) 75%),linear-gradient(-45deg,transparent 75%,var(--checker) 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
[data-theme=dark] .checker{background-color:#2c2c38}
.side-foot{display:grid;gap:10px;margin-top:auto;padding-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn-main{background:var(--tc,var(--brand));color:#fff;box-shadow:0 10px 20px -10px color-mix(in srgb,var(--tc,var(--brand)) 90%,transparent)}
.btn-main:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-main.big{height:54px;font-size:15.5px;border-radius:14px;width:100%}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-soft:hover{background:var(--surface-3)}
.btn-line{border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.btn-line:hover{border-color:var(--line-2);color:var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.note{display:flex;gap:9px;padding:11px 12px;border-radius:11px;font-size:12px;line-height:1.5;background:var(--surface-2);color:var(--ink-2)}
.note .ic{width:16px;height:16px;flex:none;margin-top:1px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.warn .ic{color:var(--warn)}
.strength{height:5px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.strength i{display:block;height:100%;width:0;transition:.25s;border-radius:9px}
.divider{height:1px;background:var(--line);margin:2px 0}
.sec-title{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}

/* busy overlay */
.busy{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);animation:fade .2s}
.busy-card{width:min(420px,90vw);padding:30px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-lg);text-align:center}
.busy-ring{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;border:4px solid var(--surface-3);border-top-color:var(--tc,var(--brand));animation:rot .8s linear infinite}
.busy-card h3{margin:0 0 4px;font-size:18px}
.busy-card p{margin:0;color:var(--muted);font-size:13px;min-height:20px}
.prog{height:7px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin-top:18px}
.prog i{display:block;height:100%;width:0;background:var(--tc,var(--brand));border-radius:9px;transition:width .25s}
.busy-card .btn{margin-top:18px}
@keyframes fade{from{opacity:0}}

/* result */
.done{max-width:720px;margin:0 auto;text-align:center;padding-top:10px}
.done-badge{width:78px;height:78px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.done-badge .ic{width:38px;height:38px;stroke-width:2.6}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{margin:0;font-size:32px;letter-spacing:-1px}
.done>p{color:var(--muted);margin:8px 0 24px}
.out-card{text-align:left;padding:8px;border-radius:var(--r-lg)}
.out{display:flex;align-items:center;gap:13px;padding:10px 10px 10px 12px;border-radius:12px}
.out+.out{border-top:1px solid var(--line);border-radius:0}
.out .fi{width:40px;height:48px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 10%,var(--surface));color:var(--tc);font-size:9.5px;font-weight:800;letter-spacing:.4px;flex:none}
.out .meta{min-width:0;flex:1}
.out .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.out .meta span{font-size:12.5px;color:var(--muted)}
.save-badge{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--ok);background:var(--ok-soft);padding:1px 8px;border-radius:99px}
.save-badge.neutral{color:var(--muted);background:var(--surface-2)}
.out .dl{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.out .dl:hover{color:var(--tc);border-color:var(--tc)}
.out-more{padding:10px 12px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
.done-actions{display:flex;gap:10px;justify-content:center;margin:20px 0 10px;flex-wrap:wrap}
.done-actions .btn-main{min-width:240px;height:54px;font-size:15.5px;border-radius:14px}
.done-links{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ask-loc{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer}
.ask-loc input{accent-color:var(--tc)}
.continue{margin-top:40px;text-align:left}
.continue h4{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cgrid a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;transition:.15s}
.cgrid a:hover{border-color:color-mix(in srgb,var(--tc) 45%,var(--line));transform:translateY(-1px);box-shadow:var(--sh-sm)}
.text-preview{width:100%;height:260px;margin-top:12px;font:12.5px/1.55 ui-monospace,Consolas,monospace}

/* viewer (sign/crop) */
.viewer{display:flex;flex-direction:column;align-items:center;gap:18px;max-height:calc(100vh - 220px);overflow:auto;padding:4px}
.vpage{position:relative;box-shadow:var(--sh);background:#fff;flex:none}
.vpage canvas{display:block;width:100%;height:100%}
.vlabel{position:absolute;left:-2px;top:-22px;font-size:11px;color:var(--muted);font-weight:600}
.layer{position:absolute;inset:0}
.item{position:absolute;cursor:move;touch-action:none;border:1.5px dashed transparent;border-radius:3px}
.item img{width:100%;height:100%;display:block;pointer-events:none}
.item.sel{border-color:var(--tc)}
.item .h-del,.item .h-rs{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--tc);color:#fff;display:none;place-items:center;box-shadow:var(--sh)}
.item.sel .h-del,.item.sel .h-rs{display:grid}
.item .h-del{right:-12px;top:-12px}
.item .h-rs{right:-12px;bottom:-12px;cursor:nwse-resize}
.item .ic{width:13px;height:13px;stroke-width:2.4}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sig{position:relative;height:70px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;padding:8px;background:var(--surface);transition:.12s}
.sig:hover{border-color:var(--tc)}
.sig img{max-width:100%;max-height:100%}
.sig .rm{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:6px;display:none;place-items:center;color:var(--muted);background:var(--surface)}
.sig:hover .rm{display:grid}
.sig .rm .ic{width:12px;height:12px}
.sig.add{border-style:dashed;color:var(--ink-2);font-weight:600;font-size:12.5px;gap:4px}
.crop-stage{position:relative;margin:0 auto;user-select:none;touch-action:none}
.crop-stage canvas{display:block;width:100%;height:100%;box-shadow:var(--sh)}
.crop-shade{position:absolute;inset:0;pointer-events:none}
.crop-rect{position:absolute;border:2px solid var(--tc);box-shadow:0 0 0 9999px rgba(15,15,30,.45);cursor:move}
.crop-rect i{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--tc);border-radius:4px}
.crop-rect i[data-h=nw]{left:-8px;top:-8px;cursor:nwse-resize}.crop-rect i[data-h=ne]{right:-8px;top:-8px;cursor:nesw-resize}
.crop-rect i[data-h=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}.crop-rect i[data-h=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
.crop-wrap{overflow:hidden;border-radius:4px;padding:10px}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--ink-2);font-weight:600}

/* studio */
.studio-canvas{display:grid;place-items:center;min-height:420px;border-radius:12px;overflow:hidden;position:relative}
.studio-canvas canvas{box-shadow:var(--sh);border-radius:4px}
.studio-canvas canvas{max-width:100%;max-height:68vh;display:block}
.studio-canvas.pick canvas{cursor:crosshair}
.studio-tag{position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;background:rgba(15,15,30,.7);color:#fff;padding:3px 9px;border-radius:99px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(12,12,25,.45);display:grid;place-items:center;padding:20px;animation:fade .15s;backdrop-filter:blur(2px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-lg);animation:up .2s cubic-bezier(.2,1,.4,1)}
.modal.wide{width:min(680px,100%)}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
.modal-h h3{margin:0;font-size:18px}
.modal-b{padding:16px 22px}
.modal-b p{margin:0 0 12px;color:var(--ink-2)}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px}
.pad{width:100%;height:220px;border-radius:12px;border:1.5px dashed var(--line-2);background:#fff;touch-action:none;cursor:crosshair;display:block}
.pad-tools{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pad-tools .colors button{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.pad-tools .colors button.on{box-shadow:0 0 0 2px var(--brand)}
.pad-tools .colors{display:flex;gap:6px}
.fonts{display:grid;gap:8px;margin-top:10px}
.fonts button{height:62px;border-radius:12px;border:1.5px solid var(--line);font-size:28px;background:#fff;color:#1d2a6b;overflow:hidden;white-space:nowrap;padding:0 14px}
.fonts button.on{border-color:var(--brand);box-shadow:var(--ring)}

/* toast + drop overlay */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(520px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:13px;background:#1b1b24;color:#fff;box-shadow:var(--sh-lg);font-size:13px;animation:up .2s}
.toast .ic{width:18px;height:18px;flex:none}
.toast.err .ic{color:#ff8a8d}.toast.ok .ic{color:#55e09a}
.toast span{flex:1}
.toast button{font-weight:700;color:#b9a9ff;font-size:12.5px;padding:4px 6px;border-radius:6px}
.toast button:hover{background:rgba(255,255,255,.08)}
.dropover{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:color-mix(in srgb,var(--tc,var(--brand)) 88%,transparent);color:#fff}
.dropover.show{display:grid;animation:fade .15s}
.dropover div{text-align:center;border:3px dashed rgba(255,255,255,.7);border-radius:28px;padding:60px 80px}
.dropover .ic{width:54px;height:54px;stroke-width:1.6}
.dropover h2{margin:14px 0 4px;font-size:28px;letter-spacing:-.6px}
.dropover p{margin:0;opacity:.85}
.suggest{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.suggest a{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:13px}
.suggest a:hover{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 5%,transparent)}

@media (max-width:1100px){.grid-tools{grid-template-columns:repeat(3,minmax(0,1fr))}.mega{grid-template-columns:repeat(3,1fr)}.quick{display:none}}
@media (max-width:900px){.ws{grid-template-columns:1fr}.side{position:static;max-height:none}.feats{grid-template-columns:1fr}}
@media (max-width:720px){.grid-tools{grid-template-columns:repeat(2,minmax(0,1fr))}.pill-safe span{display:none}.pill-safe{padding:0 9px}.mega{grid-template-columns:1fr 1fr;max-height:calc(100vh - 64px);overflow:auto}.hero{padding-top:40px}.drop-in{min-height:230px}.pages{grid-template-columns:repeat(2,minmax(0,1fr))}.pg-tools{opacity:1;transform:none}.tcard{min-height:140px;padding:16px}.suggest{grid-template-columns:1fr}}
@media (max-width:420px){.tools-btn span{display:none}.logo span.t{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* laporan watermark */
.wm-card{padding:14px 16px}
.wm-hit{border-top:1px solid var(--line);padding:12px 4px 4px}
.wm-msg{font-size:18px;font-weight:700;letter-spacing:-.2px;word-break:break-word}
.wm-msg.locked{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:15px}
.wm-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted);align-items:center}
.wm-meta .save-badge{margin:0;display:inline-flex;align-items:center;gap:4px}.wm-meta .ic{width:12px;height:12px;stroke-width:2.4}
.save-badge.warn{color:var(--warn);background:var(--warn-soft)}
.wm-none{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:12px 4px 2px;color:var(--muted);font-size:13px}.wm-none .ic{width:16px;height:16px}
.done-badge.none{background:var(--surface-2);color:var(--muted)}
.out .meta .out-method{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:11.5px;color:var(--tc);font-weight:600}.out .meta .out-method .ic{width:12px;height:12px}
.save-badge .ic{width:11px;height:11px;stroke-width:2.6;vertical-align:-1px}

/* FAQ, install, misc */
.faq{max-width:820px;margin:64px auto 0}
.faq h2{font-size:26px;letter-spacing:-.8px;margin:0 0 16px;text-align:center}
.faq details{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.faq details[open] summary .ic{transform:rotate(180deg)}
.faq details>div{padding:0 18px 16px;color:var(--ink-2);font-size:13.5px;line-height:1.65}
.faq details[open]{box-shadow:var(--sh-sm)}
.kicker .ic{width:14px;height:14px;color:var(--muted)}
.kicker:hover{border-color:var(--line-2)}
.install-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--brand);color:#fff;font-weight:700;font-size:12px}
.install-btn .ic{width:15px;height:15px;stroke-width:2.2}
.foot .dot.off{background:var(--warn)}
.foot a.ul{text-decoration:underline}

  let s = scale ?? (width ? width / base.width : 1);
  s = Math.min(s, maxSide / Math.max(base.width, base.height));
  const vp = page.getViewport({ scale: s });
  const c = canvas(vp.width, vp.height); const ctx = c.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp, background: bg }).promise;
  return c;
}

/* qpdf (WebAssembly) — enkripsi, dekripsi, optimasi lossless */
let qpdfWasmUrl;

async function qpdf(args, input) {

/* pdf-lib: muat untuk diedit; PDF dengan pembatasan (owner password) dibuka otomatis via qpdf */
async function loadForEdit(bytes) {
  const { PDFDocument } = await lib('pdflib');
  try { return await PDFDocument.load(bytes, { updateMetadata: false }); }
  catch (e) {
    if (!/encrypt/i.test(e?.message || '')) throw e;
    const { code, out } = await qpdf(['--decrypt', '/in.pdf', '/out.pdf'], bytes);
    if ((code !== 0 && code !== 3) || !out) throw Error('PDF terenkripsi. Buka dulu dengan alat Unlock PDF.');
    return PDFDocument.load(out, { updateMetadata: false });
  }
}
async function savePdf(doc) {
  doc.setProducer('PiawaiLab'); doc.setModificationDate(new Date());
  return new Blob([await doc.save({ useObjectStreams: true })], { type: 'application/pdf' });
}

/* Buka PDF dari File: menangani PDF berpassword (minta sandi lalu dekripsi via qpdf) */
async function readPdfFile(file) {
  let bytes = new Uint8Array(await file.arrayBuffer());
  let password, wrong = false;
  for (; ;) {
    try {
      const doc = await openPdf(bytes, password);
      if (password) { // simpan versi tanpa sandi agar bisa diedit
        const { code, out } = await qpdf([`--password=${password}`, '--decrypt', '/in.pdf', '/out.pdf'], bytes);
        if ((code === 0 || code === 3) && out) bytes = out;
      }
      return { bytes, doc, decrypted: !!password };
    } catch (e) {
      if (e?.name === 'PasswordException') {
        wrong = e.code === 2;
        password = await askPassword(file.name, wrong);
        if (!password) throw Object.assign(Error('Dilewati — file terkunci.'), { skipped: true });
        continue;
      }
      if (e?.name === 'InvalidPDFException') throw Error('File PDF rusak atau bukan PDF yang valid.');
      throw e;
    }
  }
}

/* Koordinat "visual" (seperti yang terlihat, origin kiri-atas, satuan pt) → koordinat PDF, memperhitungkan CropBox & /Rotate */
function pageGeom(page) {
  const box = page.getCropBox(); const R = ((page.getRotation().angle % 360) + 360) % 360;
  const { x: ox, y: oy, width: W, height: H } = box;
  const VW = R % 180 ? H : W, VH = R % 180 ? W : H;
  const map = (u, v) => R === 0 ? [ox + u, oy + H - v] : R === 90 ? [ox + v, oy + u] : R === 180 ? [ox + W - u, oy + v] : [ox + W - v, oy + H - u];
  // titik jangkar kiri-bawah untuk objek tegak berukuran w×h di posisi visual (x,y)
  const place = (x, y, w, h) => { const [px, py] = map(x, y + h); return { x: px, y: py, rotate: R }; };
  return { R, VW, VH, map, place };
}

/* parsing rentang halaman: "1-3, 5, 8-" → [[0,1,2],[4],[7..n-1]] */
function parseRanges(str, max) {
  const groups = [];
  for (const part of String(str).split(/[,;]+/).map(s => s.trim()).filter(Boolean)) {
    const m = part.match(/^(\d*)\s*(?:-\s*(\d*|z|akhir))?$/i);
    if (!m) throw Error(`Rentang "${part}" tidak valid. Contoh: 1-3, 5, 8-`);
    let a = m[1] ? +m[1] : 1, b = m[2] === undefined ? a : (m[2] === '' || /z|akhir/i.test(m[2]) ? max : +m[2]);
    if (!m[1] && m[2] === undefined) continue;
    if (a < 1 || b < 1 || a > max) throw Error(`Halaman ${a} di luar jangkauan (1–${max}).`);
    b = Math.min(b, max); const g = [];
    for (let i = a; a <= b ? i <= b : i >= b; i += a <= b ? 1 : -1) g.push(i - 1);
    groups.push(g);
  }
  if (!groups.length) throw Error('Masukkan rentang halaman.');
  return groups;
}

/* gambar: normalisasi untuk PDF (orientasi EXIF, format yang bisa disematkan) */
function jpegOrientation(buf) {
  const v = new DataView(buf); if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return 1;
  let o = 2;
  while (o + 4 < v.byteLength) {
    const marker = v.getUint16(o), len = v.getUint16(o + 2);
    if (marker === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
      const t = o + 10, le = v.getUint16(t) === 0x4949, n = v.getUint16(t + v.getUint32(t + 4, le), le);
      for (let i = 0; i < n; i++) { const e = t + v.getUint32(t + 4, le) + 2 + i * 12; if (e + 10 > v.byteLength) break; if (v.getUint16(e, le) === 0x0112) return v.getUint16(e + 8, le); }
      return 1;
    }
    if ((marker & 0xFF00) !== 0xFF00 || marker === 0xFFDA) break;
    o += 2 + len;
  }
  return 1;
}
async function normalizeImage(file, maxSide = 6000) {
  const buf = await file.arrayBuffer();
  const type = file.type || ({ png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg' })[extOf(file.name)] || '';
  const img = await decodeImage(new Blob([buf], { type }));
  const w = img.naturalWidth, h = img.naturalHeight;
  const big = Math.max(w, h) > maxSide;
  const oriented = type === 'image/jpeg' && jpegOrientation(buf) > 1;
  if ((type === 'image/jpeg' || type === 'image/png') && !big && !oriented) return { bytes: new Uint8Array(buf), mime: type, w, h, img };
  const s = Math.min(1, maxSide / Math.max(w, h)), c = canvas(w * s, h * s), ctx = c.getContext('2d');
  const keepAlpha = type !== 'image/jpeg';
  if (!keepAlpha) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(img, 0, 0, c.width, c.height);

}

/* =========================================================
   OFFICE → halaman gambar (Word, Excel/CSV, TXT/RTF)
   Setiap halaman dihasilkan sebagai JPEG + ukuran halaman (pt).

const PX2PT = .75;
function offscreenHost() {
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-30000px;top:0;background:#fff;color:#111';
  document.body.append(host); return host;
}
async function waitAssets(root) {
  await document.fonts?.ready;

}
async function rasterize(node, { scale = 2, pageHpx } = {}) {

  const wpx = node.offsetWidth, slice = pageHpx ? Math.round(pageHpx * scale) : c.height;

    const hh = Math.min(slice, c.height - y), part = canvas(c.width, pageHpx ? slice : hh), ctx = part.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, part.height); ctx.drawImage(c, 0, y, c.width, hh, 0, 0, c.width, hh);
    const blob = await toBlob(part, 'image/jpeg', .9);
    pages.push({ bytes: new Uint8Array(await blob.arrayBuffer()), mime: 'image/jpeg', w: part.width, h: part.height, ptW: wpx * PX2PT, ptH: (pageHpx || hh / scale) * PX2PT, thumbSrc: part });

async function docxToPages(file, onStep) {

  const host = offscreenHost();
  try {
    await docx.renderAsync(await file.arrayBuffer(), host, host, { className: 'docx', inWrapper: false, ignoreWidth: false, ignoreHeight: false, breakPages: true, ignoreLastRenderedPageBreak: false, experimental: true, useBase64URL: true, renderHeaders: true, renderFooters: true, renderFootnotes: true });
    await waitAssets(host);
    const sections = $$('section.docx', host); const out = [];
    for (let i = 0; i < sections.length; i++) {
      onStep?.(`Merender halaman Word ${i + 1}/${sections.length}…`);
      const s = sections[i]; s.style.margin = '0'; s.style.boxShadow = 'none';
      const ph = parseFloat(s.style.minHeight) ? s.style.minHeight : getComputedStyle(s).minHeight;
      const pageH = (() => { const d = document.createElement('div'); d.style.height = ph; host.append(d); const v = d.offsetHeight; d.remove(); return v || s.offsetWidth * 1.4142; })();
      out.push(...await rasterize(s, { pageHpx: s.offsetHeight > pageH * 1.02 ? pageH : null }));

}
function pageShell(wpx, hpx, pad) {
  const page = document.createElement('div');
  page.style.cssText = `width:${wpx}px;height:${hpx}px;padding:${pad}px;box-sizing:border-box;background:#fff;overflow:hidden;font:12px/1.45 Arial,Helvetica,sans-serif;color:#111;margin-bottom:10px`;
  const body = document.createElement('div'); body.style.cssText = `height:${hpx - pad * 2}px;overflow:hidden`;
  page.append(body); return { page, body };
}
async function flowToPages(nodes, { wpx = 794, hpx = 1123, pad = 64, wrap = n => n, onStep } = {}) {
  const host = offscreenHost(); const shells = [];
  const next = () => { const s = pageShell(wpx, hpx, pad); s.container = wrap(s.body); host.append(s.page); shells.push(s); return s; };
  try {
    let cur = next();
    for (const n of nodes) {
      cur.container.append(n);
      if (cur.body.scrollHeight > cur.body.clientHeight + 1 && cur.container.children.length > 1) { n.remove(); cur = next(); cur.container.append(n); }
    }
    const out = [];
    for (let i = 0; i < shells.length; i++) { onStep?.(`Merender halaman ${i + 1}/${shells.length}…`); out.push(...await rasterize(shells[i].page)); }
    return out;
  } finally { host.remove(); }
}
async function sheetToPages(file, onStep) {
  const XLSX = await lib('xlsx'); await lib('h2c');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const out = [];
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name]; if (!ws['!ref']) continue;
    const tmp = offscreenHost();
    tmp.innerHTML = XLSX.utils.sheet_to_html(ws, { header: '', footer: '' });
    const table = tmp.querySelector('table'); if (!table) { tmp.remove(); continue; }
    table.style.cssText = 'border-collapse:collapse;font:11px/1.35 Arial,sans-serif;white-space:nowrap';
    $$('td,th', table).forEach(c => { c.style.cssText = 'border:1px solid #c9ced6;padding:4px 7px;vertical-align:top'; });
    const rows = $$('tr', table); if (!rows.length) { tmp.remove(); continue; }
    const tw = table.offsetWidth, landscape = tw > 680;
    const wpx = landscape ? 1123 : 794, hpx = landscape ? 794 : 1123, pad = 48, avail = wpx - pad * 2;
    const k = Math.min(1, avail / tw);
    const widths = (() => { let best = null; for (const r of rows) { const cells = [...r.children]; if (cells.some(c => c.colSpan > 1)) continue; if (!best || cells.length > best.length) best = cells; } return best?.map(c => c.offsetWidth); })();
    tmp.remove();
    const wrap = body => {
      body.style.height = `${(hpx - pad * 2) / k}px`; body.style.width = `${avail / k}px`; body.style.transform = `scale(${k})`; body.style.transformOrigin = '0 0';
      const title = document.createElement('div'); title.textContent = name; title.style.cssText = 'font:700 13px Arial;margin:0 0 8px;color:#333';
      const t = document.createElement('table'); t.style.cssText = table.style.cssText + ';table-layout:fixed';
      if (widths) { const cg = document.createElement('colgroup'); widths.forEach(w => { const c = document.createElement('col'); c.style.width = w + 'px'; cg.append(c); }); t.append(cg); }
      const tb = document.createElement('tbody'); t.append(tb); body.append(title, t);
      return tb;
    };
    out.push(...await flowToPages(rows.map(r => r.cloneNode(true)), { wpx, hpx, pad, wrap, onStep: s => onStep?.(`${name}: ${s}`) }));
  }
  if (!out.length) throw Error('Spreadsheet kosong.');

}
async function textToPages(text, onStep) {
  await lib('h2c');
  const lines = text.replace(/\r\n?/g, '\n').split('\n').map(l => { const d = document.createElement('div'); d.style.cssText = 'white-space:pre-wrap;word-break:break-word;min-height:1.45em;font:12.5px/1.5 Consolas,"Courier New",monospace'; d.textContent = l; return d; });
  return flowToPages(lines, { onStep });
}
function rtfToText(rtf) {
  return rtf.replace(/\\par[d]?/g, '\n').replace(/\\'([0-9a-f]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/\{\\\*[^{}]*\}/g, '').replace(/\\[a-z]+-?\d* ?/gi, '').replace(/[{}]/g, '').replace(/\n{3,}/g, '\n\n').trim();

async function officeToPages(file, onStep) {
  const ext = extOf(file.name);
  if (ext === 'docx') return docxToPages(file, onStep);

/* =========================================================
   WATERMARK — Basic (terlihat) & Advanced (tak terlihat + kriptografi)
   Payload: [ver][flags][unix-time 4B] + pesan
     · tanpa sandi : pesan + CRC32 (siapa pun yang memakai PiawaiLab bisa membaca)
     · dengan sandi: AES-256-GCM, kunci PBKDF2-SHA256 150.000 iterasi; header jadi AAD
   Kanal "robust" (gambar/video/audio) juga diacak oleh kunci turunan sandi, jadi

const WM_MAX_MSG = 64;

/* ---------------- GAMBAR & FRAME VIDEO ----------------

function rgbaToYuv(rgba, W, H, t, cs) { // tulis kembali kanvas RGBA ke bidang YUV sumber (matriks & rentang sesuai sumber)

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const o = (y * W + x) * 4; buf[Yo + y * L[0].stride + x] = Math.round(yo + ys * (kr * rgba[o] + kg * rgba[o + 1] + kb * rgba[o + 2]) / 255); }
  for (let y = 0; y < H / sy; y++) for (let x = 0; x < W / sx; x++) {
    let r = 0, g = 0, b = 0, n = 0;
    for (let j = 0; j < sy; j++) for (let i = 0; i < sx; i++) { const px = x * sx + i, py = y * sy + j; if (px >= W || py >= H) continue; const o = (py * W + px) * 4; r += rgba[o]; g += rgba[o + 1]; b += rgba[o + 2]; n++; }
    r /= n * 255; g /= n * 255; b /= n * 255; const Yv = kr * r + kg * g + kb * b;
    const cb = Math.round(128 + cs_ * (b - Yv) / (2 * (1 - kb))), cr = Math.round(128 + cs_ * (r - Yv) / (2 * (1 - kr)));

    if (t.fmt === 'NV12') { const o = L[1].offset + cy * L[1].stride + cx * 2; buf[o] = clamp(cb, 0, 255); buf[o + 1] = clamp(cr, 0, 255); }
    else { buf[L[1].offset + cy * L[1].stride + cx] = clamp(cb, 0, 255); buf[L[2].offset + cy * L[2].stride + cx] = clamp(cr, 0, 255); }

}

}
function renderStage() {
  const t = T[current], s = S(current), st = $('#stage'); if (!st) return;
  $('.thero').classList.toggle('compact', s.stage !== 'upload');
  if (s.stage === 'upload') renderUpload(st, t);
  else if (s.stage === 'done') renderDone(st, s, t);
  else t.engine.work(st, s, t);
}
function renderUpload(st, t) {
  st.innerHTML = `<div class="drop" tabindex="0" role="button" aria-label="Pilih file"><div class="drop-in">
      <div class="drop-art"><div></div><div></div><div>${ic(t.icon)}</div></div>
      <button class="choose" type="button">${ic('upload')}Pilih file</button>
      <p>atau tarik & lepas ${t.single ? 'file' : 'file-file'} di sini · bisa juga tempel dengan Ctrl+V</p>
      <small>${t.acceptLabel}</small></div></div>
    <ul class="perks">${t.perks.map(p => `<li><span class="ck">${ic('check')}</span>${p}</li>`).join('')}</ul>`;
  const d = $('.drop', st);
  d.onclick = () => pickFiles(t);
  d.onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), pickFiles(t));
}
function pickFiles(t) {
  const inp = Object.assign(document.createElement('input'), { type: 'file', accept: t.accept, multiple: !t.single });
  inp.onchange = () => inp.files.length && addFiles([...inp.files]); inp.click();
}
async function addFiles(files) {
  const t = T[current]; if (!t) return;
  const ok = files.filter(t.test), bad = files.length - ok.length;
  if (bad) toast(`${bad} file dilewati — ${t.name} menerima ${t.acceptLabel.toLowerCase()}.`, 'err');
  if (!ok.length) return;
  let s = S(current);
  if (s.stage === 'done') { resetTool(current); s = S(current); }
  s.stage = 'work'; renderStage();
  await t.engine.add(s, ok, t);
}

/* ---------- proses & overlay ---------- */
function busyOverlay(title, sub = 'Menyiapkan…') {
  const ov = el(`<div class="busy"><div class="busy-card"><div class="busy-ring"></div><h3></h3><p></p><div class="prog"><i></i></div><button class="btn btn-line">Batalkan</button></div></div>`);
  $('h3', ov).textContent = title; $('p', ov).textContent = sub; document.body.append(ov);
  const api = {
    cancelled: false,
    set(p, msg) { $('.prog i', ov).style.width = Math.round(clamp(p, 0, 1) * 100) + '%'; if (msg) $('p', ov).textContent = msg; },
    close() { ov.remove(); }
  };
  $('button', ov).onclick = () => { api.cancelled = true; ov.remove(); toast('Dibatalkan.'); };
  return api;
}
async function runJob(t, s, fn) {
  const b = busyOverlay(`${t.action}…`), t0 = performance.now();
  let last = 0;
  const prog = async (p, msg) => { b.set(p, msg); if (performance.now() - last > 60) { last = performance.now(); await frame(); } };
  prog.check = async () => { if (b.cancelled) throw Object.assign(Error('cancel'), { cancelled: true }); };
  try {
    await frame();
    const outs = await fn(prog); await prog.check();
    b.set(1, 'Selesai');
    s.outputs = outs; s.took = (performance.now() - t0) / 1000; s.stage = 'done';
    await sleep(180); b.close(); rerender(); scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    b.close(); if (e.cancelled) return;
    console.error(e); toast(e.message || 'Terjadi kesalahan saat memproses.', 'err');
  }
}

/* ---------- hasil ---------- */
const took = s => s.took < 1 ? 'kurang dari 1 detik' : `${s.took.toFixed(1)} detik`;
const NEXT = {
  pdf: ['compress', 'merge', 'sign', 'watermark', 'page-numbers', 'split', 'organize', 'protect', 'pdf-to-image', 'crop', 'rotate', 'unlock'],
  img: ['compress', 'watermark', 'image-to-pdf', 'studio'],
};
function renderReport(st, s, t) {
  const outs = s.outputs || [], found = outs.filter(o => o.report.results.some(r => r.msg != null || r.locked));
  const fmtDate = ts => new Date(ts * 1000).toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
  const card = o => {
    const r = o.report;
    const res = r.results.length ? r.results.map(h => `<div class="wm-hit">
        ${h.msg != null ? `<div class="wm-msg">“${esc(h.msg)}”</div>` : `<div class="wm-msg locked">${ic('lock')} Pesan terenkripsi</div>`}
        <div class="wm-meta">
          ${h.verified ? `<span class="save-badge">${ic('check')} Terenkripsi · utuh & asli</span>` : h.wrong ? `<span class="save-badge warn">Kata sandi salah</span>` : h.locked ? `<span class="save-badge warn">Butuh kata sandi untuk membaca</span>` : `<span class="save-badge">${ic('check')} Utuh (CRC cocok)</span>`}
          <span>Disematkan ${fmtDate(h.ts)}</span><span>Ditemukan di: ${esc(h.where.join(', '))}</span>${h.conf < 1 ? `<span>Kekuatan sinyal ${Math.round(h.conf * 100)}%</span>` : ''}
        </div></div>`).join('')
      : `<div class="wm-none">${ic('search')} Tidak ditemukan watermark PiawaiLab${s.opts.wmPass ? ' dengan kata sandi ini' : ''}.</div>`;
    return `<div class="panel wm-card"><div class="out" style="padding:4px 4px 10px"><span class="fi">${esc(extOf(o.name).toUpperCase().slice(0, 4))}</span><div class="meta"><b>${esc(o.name)}</b><span>Metode diperiksa: ${esc(r.method)}</span></div></div>${res}</div>`;
  };
  st.innerHTML = `<div class="done"><div class="done-badge ${found.length ? '' : 'none'}">${ic(found.length ? 'shield' : 'search')}</div>
    <h2>${found.length ? `Watermark ditemukan` : 'Tidak ditemukan'}</h2>
    <p>${found.length ? `${found.length} dari ${outs.length} file berisi watermark PiawaiLab.` : 'Tidak ada watermark PiawaiLab yang terbaca di file ini.'} Diperiksa dalam ${took(s)}.</p>
    <div style="display:grid;gap:12px;text-align:left">${outs.map(card).join('')}</div>
    ${!found.length && !s.opts.wmPass ? `<div class="note" style="margin-top:14px;text-align:left">${ic('info')}<span>Watermark yang dibuat dengan kata sandi tidak bisa ditemukan tanpa sandi yang sama. File yang dipotong, diputar, atau diedit berat juga bisa kehilangan watermark.</span></div>` : ''}
    <div class="done-links" style="margin-top:20px"><button class="tbtn" data-back>${ic('back')}Kembali</button><button class="tbtn" data-new>${ic('refresh')}Periksa file lain</button></div></div>`;
  st.onclick = e => { if (e.target.closest('[data-back]')) { s.stage = 'work'; rerender(); } if (e.target.closest('[data-new]')) { const o = s.opts; resetTool(t.id); Object.assign(S(t.id).opts, { mode: o.mode }); rerender(); } };
}
function renderDone(st, s, t) {
  if ((s.outputs || []).length && s.outputs.every(o => o.report)) return renderReport(st, s, t);
  const outs = s.outputs || [], one = outs.length === 1, kind = outs.every(o => /\.pdf$/i.test(o.name)) ? 'pdf' : outs.every(o => /\.(png|jpe?g|webp)$/i.test(o.name)) ? 'img' : null;
  const totalB = outs.reduce((a, o) => a + (o.before || 0), 0), totalA = outs.reduce((a, o) => a + (o.after || 0), 0);
  const saving = totalB && totalA < totalB ? Math.round((1 - totalA / totalB) * 100) : 0;
  const allSame = outs.length && outs.every(o => o.same);
  const title = t.id === 'compress' ? (allSame ? 'Sudah optimal' : `Hemat ${saving}%`) : 'Selesai!';
  const sub = t.id === 'compress' ? (allSame ? 'File Anda sudah sangat efisien — ukurannya tidak bisa diperkecil lagi tanpa merusak kualitas.' : `${fmtSize(totalB)} → ${fmtSize(totalA)} · diproses dalam ${took(s)}`) : `${outs.length} file siap diunduh · diproses dalam ${took(s)} di perangkat Anda`;
  const MAX = 8;
  const row = (o, i) => `<div class="out"><span class="fi">${esc(extOf(o.name).toUpperCase())}</span><div class="meta"><b title="${esc(o.name)}">${esc(o.name)}</b><span>${o.before && !o.same ? `${fmtSize(o.before)} → ${fmtSize(o.after)}<span class="save-badge">−${Math.round((1 - o.after / o.before) * 100)}%</span>` : fmtSize(o.blob.size)}${o.same ? '<span class="save-badge neutral">tidak berubah</span>' : ''}${o.dims ? ' · ' + o.dims : ''}${o.verified ? `<span class="save-badge">${ic('check')} Watermark terverifikasi</span>` : ''}</span>${o.method ? `<span class="out-method">${ic('shield')}${esc(o.method)}${o.note ? ' · ' + esc(o.note) : ''}</span>` : ''}</div><button class="dl" data-dl="${i}" title="Unduh">${ic('download')}</button></div>`;
  const txt = one && outs[0].text != null ? outs[0] : null;
  const next = kind ? NEXT[kind].filter(id => id !== t.id && T[id].test(new File([], outs[0].name))).slice(0, 8) : [];
  st.innerHTML = `<div class="done"><div class="done-badge">${ic('check')}</div><h2>${title}</h2><p>${sub}</p>
    <div class="panel out-card">${outs.slice(0, MAX).map(row).join('')}${outs.length > MAX ? `<div class="out-more">+ ${outs.length - MAX} file lainnya ada di dalam ZIP</div>` : ''}</div>
    ${txt ? `${txt.empty ? `<div class="note warn" style="margin-top:12px;text-align:left">${ic('alert')}<span>Tidak ditemukan teks. PDF ini kemungkinan hasil scan (berupa gambar).</span></div>` : ''}<textarea class="inp text-preview" readonly>${esc(txt.text.slice(0, 200000))}</textarea>` : ''}
    <div class="done-actions"><button class="btn btn-main" data-main>${ic(one ? 'download' : 'zip')}${one ? 'Unduh' : `Unduh semua (ZIP)`}</button>${txt ? `<button class="btn btn-line" data-copy>${ic('copy')}Salin teks</button>` : ''}</div>
    <div class="done-links"><button class="tbtn" data-back>${ic('back')}Kembali ke editor</button><button class="tbtn" data-new>${ic('refresh')}Mulai dari awal</button></div>
    ${window.showSaveFilePicker ? `<label class="ask-loc"><input type="checkbox" data-ask ${store.get('askLocation', true) ? 'checked' : ''}> Tanyakan folder & nama saat menyimpan</label>` : ''}
    ${next.length ? `<div class="continue"><h4>Lanjutkan dengan hasil ini</h4><div class="cgrid">${next.map(id => `<a href="#/${id}" data-next="${id}" style="--tc:${T[id].color}"><span class="ti sm">${ic(T[id].icon)}</span>${T[id].name}</a>`).join('')}</div></div>` : ''}</div>`;
  const dl = async () => { if (one) return saveBlob(outs[0].blob, outs[0].name); const b = busyOverlay('Membuat ZIP…'); try { const z = await zipOutputs(outs, `${t.id === 'pdf-to-image' ? firstBase(s) + '-gambar' : 'piawailab-' + t.id}.zip`); b.close(); await saveBlob(z.blob, z.name); } catch (e) { b.close(); toast(e.message, 'err'); } };
  st.onclick = async e => {
    if (e.target.closest('[data-main]')) return dl();
    const i = e.target.closest('[data-dl]')?.dataset.dl; if (i != null) return saveBlob(outs[i].blob, outs[i].name);
    if (e.target.closest('[data-copy]')) { try { await navigator.clipboard.writeText(txt.text); toast('Teks disalin ke clipboard.', 'ok'); } catch { $('.text-preview', st).select(); document.execCommand('copy'); toast('Teks disalin.', 'ok'); } }
    if (e.target.closest('[data-back]')) { s.stage = 'work'; rerender(); }
    if (e.target.closest('[data-new]')) resetTool(t.id);
    const nx = e.target.closest('[data-next]'); if (nx) { e.preventDefault(); openWith(nx.dataset.next, outs.map(o => new File([o.blob], o.name, { type: o.blob.type }))); }
  };
  const ask = $('[data-ask]', st); if (ask) ask.onchange = () => store.set('askLocation', ask.checked);
}

/* ---------- drag & drop global, tempel, keyboard ---------- */
function setupGlobal() {
  const ov = $('#dropover'); let depth = 0;
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; const t = T[current]; $('h2', ov).textContent = t ? `Lepaskan untuk ${t.name}` : 'Lepaskan file di sini'; $('p', ov).textContent = t ? t.acceptLabel : 'Kami akan menyarankan alat yang cocok'; ov.classList.add('show'); });
  addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--depth <= 0) { depth = 0; ov.classList.remove('show'); } });
  addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; ov.classList.remove('show'); const files = [...e.dataTransfer.files]; if (!files.length) return; current ? addFiles(files) : suggestTools(files); });
  addEventListener('paste', e => {
    if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
    const files = [...(e.clipboardData?.files || [])]; if (!files.length) return;
    const named = files.map((f, i) => f.name && f.name !== 'image.png' ? f : new File([f], `tempel-${Date.now()}-${i}.${(f.type.split('/')[1] || 'png').replace('jpeg', 'jpg')}`, { type: f.type }));
    e.preventDefault(); current ? addFiles(named) : suggestTools(named);
  });
  addEventListener('keydown', e => {
    if (e.target.closest?.('input,textarea,select,[contenteditable]') || $('.modal-bg,.busy')) return;
    if (e.key === '/' && !current) { e.preventDefault(); $('#q')?.focus(); return; }
    if (e.key === 'Escape') closeMega?.();
    const t = T[current], s = current && S(current); if (t && s?.stage === 'work') t.engine.key?.(e, s, t);
  });
  addEventListener('hashchange', route);
}
function suggestTools(files) {
  const fits = TOOLS.filter(t => files.every(t.test));
  if (!fits.length) return toast('Format file ini belum didukung.', 'err');
  const body = el(`<div><p>${files.length} file: <b>${esc(files.slice(0, 2).map(f => f.name).join(', '))}${files.length > 2 ? '…' : ''}</b></p><div class="suggest">${fits.map(t => `<a href="#/${t.id}" data-id="${t.id}" style="--tc:${t.color}"><span class="ti sm">${ic(t.icon)}</span>${t.name}</a>`).join('')}</div></div>`);
  modal({ title: 'Mau diapakan file ini?', body, wide: true, onOpen: (bg, close) => { body.onclick = e => { const a = e.target.closest('[data-id]'); if (!a) return; e.preventDefault(); close(); openWith(a.dataset.id, files); }; } });
}

/* ---------- PWA: offline & pasang sebagai aplikasi ---------- */
function setupPwa() {
  const net = $('#netState'), setNet = () => { net.innerHTML = navigator.onLine ? `<span class="dot"></span>Semua file diproses di perangkat Anda — tidak ada yang diunggah.` : `<span class="dot off"></span>Mode offline — alat tetap berjalan.`; };
  addEventListener('online', setNet); addEventListener('offline', setNet); setNet();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  let deferred = null; const btn = $('#installBtn');
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.classList.remove('hidden'); });
  btn.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => { }); deferred = null; btn.classList.add('hidden'); };
  addEventListener('appinstalled', () => { btn.classList.add('hidden'); toast('PiawaiLab terpasang. Buka dari menu aplikasi Anda.', 'ok'); });
}

/* ---------- start ---------- */
setupShell(); setupGlobal(); setupPwa(); route();
window.PiawaiLab = { version: '2.2' };
// panaskan pustaka inti saat browser santai
(window.requestIdleCallback || setTimeout)(() => { lib('pdflib').catch(() => { }); pdfjs().catch(() => { }); }, { timeout: 2500 });

})();
</script>
